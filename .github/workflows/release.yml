name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.Version=$VERSION -X main.Commit=$GITHUB_SHA -X main.Date=$DATE"

          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "dist/mtok_${VERSION}_windows_amd64.exe" ./cmd/mtok
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "dist/mtok_${VERSION}_linux_amd64" ./cmd/mtok
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o "dist/mtok_${VERSION}_darwin_arm64" ./cmd/mtok

          (
            cd dist
            sha256sum \
              "mtok_${VERSION}_windows_amd64.exe" \
              "mtok_${VERSION}_linux_amd64" \
              "mtok_${VERSION}_darwin_arm64" > checksums.txt
          )
          cat dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "dist/mtok_${VERSION}_windows_amd64.exe" \
            "dist/mtok_${VERSION}_linux_amd64" \
            "dist/mtok_${VERSION}_darwin_arm64" \
            dist/checksums.txt
